name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Fetch LibreHardwareMonitor DLLs
        run: python -c "from sensors import _fetch_lhm_dlls; assert _fetch_lhm_dlls('lib'), 'DLL fetch failed'"

      - name: Build with PyInstaller
        run: pyinstaller --noconsole --onedir --noupx --uac-admin --name Vitals --add-data "lib;lib" main.py

      - name: Zip the build
        run: Compress-Archive -Path dist/Vitals/* -DestinationPath Vitals-${{ github.ref_name }}-windows.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: Vitals-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
